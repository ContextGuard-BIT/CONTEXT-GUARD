version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/models:/app/backend/models
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: contextguard
      POSTGRES_PASSWORD: contextguard
      POSTGRES_DB: contextguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
